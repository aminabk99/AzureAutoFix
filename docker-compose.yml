version: "3.9"

# The Streamlit frontend container is gone. The UI is now a single static page
# (frontend/index.html) served by the backend itself at /app, so there is only
# one service, one port, and no second image to build.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./model:/app/model
      - ./data:/app/data
      - ./frontend:/app/frontend
    environment:
      - PYTHONUNBUFFERED=1
      # Required for interactive Microsoft sign-in on the demo page.
      # Public identifiers only -- no client secret is exposed to the browser.
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - DEMO_API_KEY=${DEMO_API_KEY:-}
    restart: unless-stopped
